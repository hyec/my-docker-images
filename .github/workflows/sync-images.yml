# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync upstream images

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Query all subscriptions, including disabled examples, without publishing
        type: boolean
        default: false
      force_rebuild:
        description: Rebuild every enabled image even when inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-images-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install PyYAML==6.0.3 oras==0.2.43
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Check or publish images
        shell: bash
        env:
          CHECK_ONLY: ${{ inputs.check_only || false }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail
          if [[ "$CHECK_ONLY" == true ]]; then
            python .github/scripts/sync_images.py --check
          elif [[ "$FORCE_REBUILD" == true ]]; then
            python .github/scripts/sync_images.py --force
          else
            python .github/scripts/sync_images.py
          fi
      - name: Commit successful publications and monthly check status
        if: ${{ !cancelled() && !inputs.check_only }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: sync upstream images'
          git push origin HEAD:master
